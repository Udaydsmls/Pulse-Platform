apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: pulse
            - name: POSTGRES_PASSWORD
              value: pulse
            - name: POSTGRES_DB
              value: pulsedb
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        # Good enough for a demo cluster; the data goes away with the pod.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pulse
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
