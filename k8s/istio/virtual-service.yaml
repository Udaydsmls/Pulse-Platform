apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway
  namespace: pulse-platform
spec:
  hosts:
    - api-gateway
    - api.pulse-platform.example.com
  gateways:
    - mesh
  http:
    - timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: "gateway-error,connect-failure,retriable-4xx"
      route:
        - destination:
            host: api-gateway
            port:
              number: 3000
