name: Security Scan

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: jeremylong/DependencyCheck@v2.4.0
        with:
          project: pulse-platform
          path: .
          format: SARIF
          out: dependency-check-report
          args: >
            --enableRetired
            --enableExperimental
            --failOnCVSS 7

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: dependency-check-report/dependency-check-report.sarif

      - name: Upload full report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: dependency-check-report/

  snyk-monitor:
    name: Snyk Monitor — All Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - path: services/user-service
            type: golang
          - path: services/order-service
            type: golang
          - path: services/inventory-service
            type: golang
          - path: services/payment-service
            type: golang
          - path: services/notification-service
            type: golang
          - path: services/api-gateway
            type: node

    steps:
      - uses: actions/checkout@v4

      # Go services
      - name: Set up Go (Go services)
        if: matrix.service.type == 'golang'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Snyk monitor (Go)
        if: matrix.service.type == 'golang'
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --org=${{ vars.SNYK_ORG }} --project-name=${{ matrix.service.path }}
        working-directory: ${{ matrix.service.path }}

      # Node service
      - name: Set up Node.js (Node services)
        if: matrix.service.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.service.path }}/package-lock.json

      - name: Install Node dependencies
        if: matrix.service.type == 'node'
        run: npm ci
        working-directory: ${{ matrix.service.path }}

      - name: Snyk monitor (Node)
        if: matrix.service.type == 'node'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --org=${{ vars.SNYK_ORG }} --project-name=${{ matrix.service.path }}
        working-directory: ${{ matrix.service.path }}
