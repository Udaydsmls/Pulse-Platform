name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  go:
    name: Go services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - order-service
          - inventory-service
          - payment-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # go.sum is not committed, so resolve the dependencies first.
      - name: Resolve dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod tidy

      - name: Vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  gateway:
    name: API gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: services/api-gateway
        run: npm install

      - name: Build
        working-directory: services/api-gateway
        run: npm run build

      - name: Test
        working-directory: services/api-gateway
        run: npm test
