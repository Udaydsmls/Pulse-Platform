name: order-service CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "services/order-service/**"
      - "proto/**"
  pull_request:
    paths:
      - "services/order-service/**"
      - "proto/**"

env:
  SERVICE: order-service
  SERVICE_PATH: services/order-service
  PROTO: order
  ECR_REPOSITORY: pulse-platform/order-service
  AWS_REGION: us-east-1
  GO_VERSION: "1.22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # gen/pb is generated rather than committed, so every job that compiles
      # has to run protoc first.
      - name: Generate protobuf code
        uses: ./.github/actions/protoc
        with:
          proto: ${{ env.PROTO }}
          service-path: ${{ env.SERVICE_PATH }}

      - name: Vet
        working-directory: ${{ env.SERVICE_PATH }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ env.SERVICE_PATH }}
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ env.SERVICE }}
          path: ${{ env.SERVICE_PATH }}/coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate protobuf code
        uses: ./.github/actions/protoc
        with:
          proto: ${{ env.PROTO }}
          service-path: ${{ env.SERVICE_PATH }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ env.SERVICE_PATH }}
          args: --timeout=5m

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate protobuf code
        uses: ./.github/actions/protoc
        with:
          proto: ${{ env.PROTO }}
          service-path: ${{ env.SERVICE_PATH }}

      - name: Go build
        working-directory: ${{ env.SERVICE_PATH }}
        run: go build ./...

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker build & push
        if: github.event_name == 'push'
        working-directory: ${{ env.SERVICE_PATH }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                       -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate protobuf code
        uses: ./.github/actions/protoc
        with:
          proto: ${{ env.PROTO }}
          service-path: ${{ env.SERVICE_PATH }}

      - name: Snyk scan
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high ${{ env.SERVICE_PATH }}
