name: Generate protobuf code
description: >-
  Installs protoc and the Go plugins, then generates gen/pb for one service.
  The generated code is not committed, so every job that compiles Go needs this.

inputs:
  proto:
    description: Proto file basename, e.g. "order" for proto/order.proto
    required: true
  service-path:
    description: Path to the service, e.g. "services/order-service"
    required: true

runs:
  using: composite
  steps:
    - name: Install protoc
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install protoc Go plugins
      shell: bash
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

    - name: Generate
      shell: bash
      run: |
        out="${{ inputs.service-path }}/gen/pb"
        mkdir -p "$out"
        protoc --proto_path=proto \
          --go_out="$out" --go_opt=paths=source_relative \
          --go-grpc_out="$out" --go-grpc_opt=paths=source_relative \
          "proto/${{ inputs.proto }}.proto"

    - name: Resolve dependencies
      shell: bash
      working-directory: ${{ inputs.service-path }}
      run: go mod tidy
