# Shared golangci-lint config. Each service is its own module, but lint runs
# from the repo root config so all five stay consistent.
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - errorlint

issues:
  exclude-rules:
    # Generated protobuf code is not ours to lint.
    - path: gen/pb/
      linters:
        - errcheck
        - govet
        - staticcheck
        - unused

linters-settings:
  errcheck:
    # Deferred rollbacks and closes on a shutdown path have nothing useful to do
    # with the error.
    exclude-functions:
      - (github.com/jackc/pgx/v5.Tx).Rollback
