replicaCount: 3

image:
  repository: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/pulse-platform/notification-service
  tag: "latest"
  pullPolicy: Always

service:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  KAFKA_BROKERS: "$(KAFKA_BOOTSTRAP_SERVERS)"
  DYNAMODB_TABLE: "pulse-notifications"

  # Traces go to the collector, which fans out to Jaeger and Datadog.
  OTEL_ENDPOINT: "otel-collector:4317"

envFrom:
  - secretRef:
      name: notification-service-secrets
