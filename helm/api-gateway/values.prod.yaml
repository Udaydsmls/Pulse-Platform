replicaCount: 3

image:
  repository: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/pulse-platform/api-gateway
  tag: "latest"
  pullPolicy: Always

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  PORT: "3000"
  GRPC_PORT: "3000"
  KAFKA_BROKERS: "$(KAFKA_BOOTSTRAP_SERVERS)"
  DATABASE_URL: "postgresql://pulseadmin:$(DB_PASSWORD)@$(DB_HOST):5432/pulsedb?sslmode=require"
  LOG_LEVEL: "info"
  ENVIRONMENT: "prod"

envFrom:
  - secretRef:
      name: api-gateway-secrets
