replicaCount: 3

image:
  repository: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/pulse-platform/payment-service
  tag: "latest"
  pullPolicy: Always

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  DATABASE_URL: "postgresql://pulseadmin:$(DB_PASSWORD)@$(DB_HOST):5432/pulsedb?sslmode=require"
  KAFKA_BROKERS: "$(KAFKA_BOOTSTRAP_SERVERS)"

  # Traces go to the collector, which fans out to Jaeger and Datadog.
  OTEL_ENDPOINT: "otel-collector:4317"

envFrom:
  - secretRef:
      name: payment-service-secrets
