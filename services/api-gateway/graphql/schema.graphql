type User {
  userId: ID!
  email: String!
  name: String!
  provider: String
  createdAt: String
}

type OrderItem {
  productId: ID!
  quantity: Int!
  unitPrice: Float!
}

type Order {
  orderId: ID!
  userId: ID!
  status: String!
  items: [OrderItem!]!
  total: Float!
  createdAt: String!
}

type StockStatus {
  available: Boolean!
  stockLevel: Int!
}

input OrderItemInput {
  productId: ID!
  quantity: Int!
  unitPrice: Float!
}

type Query {
  me: User
  order(orderId: ID!): Order
  checkStock(productId: ID!, quantity: Int!): StockStatus
}

type Mutation {
  "Starts the order saga and returns the order once it is recorded."
  createOrder(items: [OrderItemInput!]!): Order!
  "Cancels an order, which releases any stock reserved for it."
  cancelOrder(orderId: ID!): Boolean!
}
