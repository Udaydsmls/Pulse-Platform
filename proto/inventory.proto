syntax = "proto3";
package inventory.v1;
option go_package = "github.com/pulse-platform/inventory-service/gen/pb;pb";

// Reserving and releasing stock happen over Kafka as part of the order saga,
// not over gRPC. The only thing worth asking synchronously is whether an item
// is in stock, which the api-gateway does before showing a product.
service InventoryService {
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
}

message CheckStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool available = 1;
  int32 stock_level = 2;
}
