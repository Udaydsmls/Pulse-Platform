global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load alerting rules
rule_files:
  - "alert_rules.yml"

# Remote write to Cortex/Thanos (uncomment to enable)
# remote_write:
#   - url: "http://cortex-distributor:9009/api/prom/push"
#     # or for Thanos:
#   - url: "http://thanos-receive:19291/api/v1/receive"

scrape_configs:
  # Scrape kubernetes pods that have prometheus.io/scrape=true annotation
  - job_name: "kubernetes-pods"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Only keep pods with prometheus.io/scrape: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Use prometheus.io/port annotation for scrape port
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __address__]
        action: replace
        regex: (\d+);(([A-Fa-f0-9]{1,4}:){7}[A-Fa-f0-9]{1,4}|(\d+\.){3}\d+):\d+
        replacement: $2:$1
        target_label: __address__
      # Use prometheus.io/path annotation for metrics path
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # Add namespace label
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      # Add pod name label
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
      # Add service label from pod label
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: service

  # Scrape kubernetes services
  - job_name: "kubernetes-services"
    kubernetes_sd_configs:
      - role: service
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+)
        replacement: $1
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: kubernetes_service_name

  # Scrape OpenTelemetry Collector Prometheus exporter
  - job_name: "otel-collector"
    static_configs:
      - targets:
          - "otel-collector:8889"
    metrics_path: /metrics
