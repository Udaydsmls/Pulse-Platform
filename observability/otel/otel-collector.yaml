---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: pulse-platform
data:
  otelcol-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: "otel-collector-self"
              scrape_interval: 15s
              static_configs:
                - targets: ["0.0.0.0:8888"]

    processors:
      batch:
        send_batch_size: 1000
        timeout: 10s

      memory_limiter:
        limit_mib: 512
        spike_limit_mib: 128
        check_interval: 5s

      resource:
        attributes:
          - key: service.namespace
            value: pulse-platform
            action: upsert

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: pulse_platform
        send_timestamps: true

      otlp/jaeger:
        endpoint: "jaeger-collector:4317"
        tls:
          insecure: true

      datadog:
        api:
          key: ${DD_API_KEY}
          site: datadoghq.com
        traces:
          trace_buffer: 1000

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [otlp/jaeger, datadog]

        metrics:
          receivers: [otlp, prometheus]
          processors: [batch]
          exporters: [prometheus, datadog]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: pulse-platform
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.99.0
          command:
            - /otelcol-contrib
            - --config=/etc/otelcol/otelcol-config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: prometheus
              containerPort: 8889
              protocol: TCP
            - name: self-metrics
              containerPort: 8888
              protocol: TCP
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: pulse-platform
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: prometheus
      port: 8889
      targetPort: 8889
      protocol: TCP
    - name: self-metrics
      port: 8888
      targetPort: 8888
      protocol: TCP
  type: ClusterIP
